# Despliegue en Render: 5 web services independientes (gateway + 4 microservicios).
#   render blueprint launch
#
# LA BASE DE DATOS YA NO ESTA AQUI.
#
# Con SQLite cada servicio necesitaba un disco persistente, porque el archivo
# .db vivia dentro del servidor. Con Postgres (Supabase) eso desaparece: la
# base de datos es un servicio externo y Render no tiene que guardarla.
#
# Eso significa que esto YA FUNCIONA EN VERCEL, RAILWAY O CUALQUIER HOST:
# no hay nada atado al disco del servidor. (Vercel tiene una salvedad: sus
# funciones serverless se congelan tras un rato de inactividad, asi que la
# primera peticion puede tardar. Render es mejor para este caso.)

services:
  # ---------------------------------------------------------------
  # Microservicio 1: Pokemon (Postgres propia, 20 registros)
  # ---------------------------------------------------------------
  - type: web
    name: pokemon-service
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: backend/services/pokemon-service
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      # sync: false = NO aparece en el dashboard. Es la opcion segura para
      # credenciales: asi la clave nunca se imprime en los logs.
      # En el dashboard: Environment > tu servicio > Secret Files / Environment
      - key: POKEMON_DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # NO se fija PORT a proposito. Render detecta en que puerto escucha la
      # app y lo inyecta solo en la variable PORT. Fijarlo aqui confusion:
      # si alguien pone 5432 (el de Postgres) por error, el gateway recibe
      # la URL interna equivocada y todas las llamadas fallan con 503.

  # ---------------------------------------------------------------
  # Microservicio 2: One Piece (MongoDB propia, 20 personajes)
  #
  # OJO: este es el unico servicio en PYTHON (FastAPI + uvicorn). Render lo
  # distingue por `runtime: python`. El contrato HTTP es identico al que tenia
  # la version Node, asi que el gateway y el frontend no cambian.
  #
  # Es ademas el unico servicio con base de datos NO RELACIONAL: MongoDB Atlas.
  # Pokemon sigue con PostgreSQL. El enunciado pide una de cada tipo.
  #
  # MongoDB Atlas exige `retryWrites=true&w=majority` en la URI para que las
  # escrituras tengan garantia de reconocimiento; van dentro de la propia URI,
  # asi que se pega tal cual desde el panel de Atlas ("Connect" > driver
  # Node/Python). No hay que configurar nada mas de red: Atlas acepta
  # conexiones desde cualquier IP, que es lo que hace falta porque Render no
  # tiene IP fija.
  # ---------------------------------------------------------------
  - type: web
    name: onepiece-service
    runtime: python
    plan: free
    autoDeploy: true
    rootDir: backend/services/onepiece-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # sync: false = NO aparece en el dashboard (ver nota de pokemon-service).
      # Es donde se pega la URI de Atlas con usuario y contrasena.
      - key: ONEPIECE_MONGODB_URI
        sync: false
      # Render instala el Python que se le indique. Se fija 3.12 porque es una
      # version estable con ruedas precompiladas de pymongo y uvloop; con una
      # version mas nueva pip podria intentar compilar y tardar o fallar.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # PORT lo detecta Render. Ver la nota en pokemon-service.

  # ---------------------------------------------------------------
  # Microservicio 3: Docentes (Postgres propia)
  #
  # Este es el servicio AGNOSTICO: no usa Express ni ningun framework de
  # HTTP. Solo `node:http`, el modulo que ya trae Node. Su unica dependencia
  # npm es `pg`, porque Node no incluye un driver de PostgreSQL.
  # La documentacion OpenAPI tambien esta escrita a mano (src/docs/openapi.js),
  # sin swagger-jsdoc ni swagger-ui-express: Swagger UI se carga desde un CDN
  # dentro de una pagina HTML propia.
  #
  # El servicio expone GET (consultas por path/query params) y POST/PUT/DELETE
  # (escritura con JSON en el cuerpo, leido con tope de tamano). Sigue sin usar
  # ningun framework: enrutado, CORS, 405, 404 y lectura del cuerpo estan
  # escritos a mano sobre `node:http`.
  # ---------------------------------------------------------------
  - type: web
    name: docentes-service
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: backend/services/docentes-service
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      # sync: false = NO aparece en el dashboard (ver nota de pokemon-service).
      # Es donde se pega la URI de la base de datos de docentes en Supabase.
      - key: DOCENTES_DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # PORT lo detecta Render. Ver la nota en pokemon-service.

  # ---------------------------------------------------------------
  # Microservicio 4: Asistente de IA (Actividad en Clase 13)
  #
  # Es el servicio que consulta una IA PUBLICA (Google Gemini, plan gratuito)
  # para responder preguntas de la app, limitando el contexto a su propia base
  # de datos. No tiene base propia: arma el contexto pidiendo los datos a los
  # otros tres microservicios (Pokemon, One Piece y Docentes) por su API.
  #
  # GEMINI_API_KEY es un secreto: va con sync:false y se pega en el dashboard
  # (Environment). El frontend NUNCA la ve: la app habla con el gateway, el
  # gateway con este servicio y este con la IA.
  # ---------------------------------------------------------------
  - type: web
    name: asistente-service
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: backend/services/asistente-service
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # Modelo gratis de Gemini. Se puede cambiar sin tocar el codigo.
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      # De donde saca el contexto (los otros microservicios), igual que el
      # gateway: Render inyecta el hostname publico de cada servicio.
      - key: POKEMON_SERVICE_URL
        fromService:
          name: pokemon-service
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: ONEPIECE_SERVICE_URL
        fromService:
          name: onepiece-service
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DOCENTES_SERVICE_URL
        fromService:
          name: docentes-service
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      # PORT lo detecta Render. Ver la nota en pokemon-service.

  # ---------------------------------------------------------------
  # API Gateway: unica URL que conoce el frontend
  # ---------------------------------------------------------------
  - type: web
    name: gateway
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: backend/gateway
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      # PORT lo detecta Render. Ver la nota en pokemon-service.
      #
      # fromService + envVarKey: Render inyecta el VALOR de una variable de
      # entorno del otro servicio. RENDER_EXTERNAL_HOSTNAME es una variable
      # que Render define sola en cada web service y vale el subdominio
      # publico, por ejemplo "pokemon-service-rtjy.onrender.com".
      #
      # POR QUE NO se usa property: hostport (la red privada interna):
      #   propiedad hostport daria "pokemon-service:10000". Eso funciona entre
      #   servicios DE PAGO en la misma region, pero los nuestros son plan
      #   FREE, y Render dice en su documentacion: "Free web services can't
      #   receive private network traffic". Un servicio free NO tiene
      #   hostname en la red privada, asi que esa direccion da ENOTFOUND
      #   (comprobado con el campo detail del 503 del gateway).
      #   Por eso el gateway llama al microservicio por su URL PUBLICA.
      #
      # Esto NO rompe el requisito del profesor: el gateway sigue siendo la
      # unica URL publica que conoce el frontend, y sigue llamando a NUESTROS
      # microservicios, no a PokeAPI ni a One Piece API. La unica diferencia
      # es que el salto gateway -> microservicio sale a internet en vez de ir
      # por la red privada, porque la red privada no esta disponible en free.
      #
      # config.js le antepone "https://" al host (ver normalizeUrl).
      - key: POKEMON_SERVICE_URL
        fromService:
          name: pokemon-service
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: ONEPIECE_SERVICE_URL
        fromService:
          name: onepiece-service
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DOCENTES_SERVICE_URL
        fromService:
          name: docentes-service
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      # Servicio de IA: la app pregunta por aqui y el gateway reenvia al
      # asistente. La clave de Gemini NO pasa por el gateway.
      - key: ASISTENTE_SERVICE_URL
        fromService:
          name: asistente-service
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME